# ⚠️ mnemosyne is DECOMMISSIONED (2026-06-05) — superseded by Mem0 + LobeChat memory.
# The app (backend, mcp-server) is removed and the `mnemosyne` DB was dropped
# (final dump: ~/mnemosyne-pg-final-20260605-*.sql.gz).
#
# This Postgres is RETAINED ONLY because LobeChat's live DB lives here
# (lobe-chat → host.docker.internal:5432/lobechat). It is ParadeDB w/ pg_search,
# which LobeChat requires for full-text search.
#
# TODO (LobeChat transformation): give LobeChat its OWN ParadeDB, migrate the
# `lobechat` DB out, repoint lobe-chat, then retire this container + dir.
# Until then: do NOT recreate this container with changed config (live data).
services:
  postgres:
    image: paradedb/paradedb:latest-pg17
    restart: always
    command: postgres -c shared_preload_libraries=pg_search
    environment:
      - POSTGRES_USER=mnemosyne
      - POSTGRES_PASSWORD=mnemosyne
      - POSTGRES_DB=lobechat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemosyne"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
